description: >-
  Well-known document probe across every host operated by an AAIF-hosted project. Only
  modelcontextprotocol.io serves anything at /.well-known/: an RFC 9116 security.txt and an A2A agent
  card (plus two agent-skill documents the card points at). Every other host answers 404. The
  registry API answers /.well-known/* with an RFC 9457 problem+json 404 that suggests the versioned
  paths /v0/.well-known/* and /v0.1/.well-known/* — both of which were probed and also 404.
