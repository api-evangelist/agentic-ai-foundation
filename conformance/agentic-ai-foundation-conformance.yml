compliance:
  certifications_published: false
  trust_center: false
  detail: >-
    No SOC 2, ISO 27001, PCI, HIPAA or FedRAMP claim appears on any AAIF host, and no trust center exists.
    This is expected: AAIF is a Linux Foundation standards body, not a data processor, and its projects are
    self-hosted software rather than a managed service.
