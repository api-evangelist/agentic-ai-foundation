lifecycle_state:
  location: ResponseMeta -> RegistryExtensions
  fields:
    status: active | deprecated | deleted
    statusMessage: free text up to 500 characters
    statusChangedAt: RFC3339 timestamp
    isLatest: boolean, marks the current version of a named server
    publishedAt: RFC3339 timestamp
    updatedAt: RFC3339 timestamp — the field the updated_since incremental-sync filter compares against
  note: >-
    Lifecycle state is registry-owned and lives OUTSIDE the publisher's document, which is why a publisher
    cannot set its own status in a publish call and must use the PATCH status operations instead.
