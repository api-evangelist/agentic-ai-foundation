description: >-
  Entity-relationship graph of the Official MCP Registry API, derived from the $ref links between the 28
  schemas in the published contract. The root entity is ServerJSON — one registry record describing one
  MCP server — and everything else hangs off it as an installation detail (Package, Transport, Argument)
  or as registry-owned bookkeeping (RegistryExtensions).
root_entity: ServerJSON
identity:
  primary_key: name
  format: reverse-DNS namespace, e.g. io.github.<owner>/<server> or com.example/<server>
  versioning: >-
    A record is keyed by (name, version). Paths are /v0.1/servers/{serverName}/versions/{version}, so
    version is part of the identity, not an attribute of a single mutable record.
  ownership: >-
    The namespace prefix is the ownership boundary — a publisher must prove control of the GitHub org/user
    or the DNS domain the name derives from before the registry will accept a publish.
entities:
  - name: ServerJSON
    description: The server record a publisher submits and the registry stores.
    fields: [$schema, _meta, description, icons, name, packages, remotes, repository, title, version, websiteUrl]
  - name: ServerResponse
    description: Read wrapper — a ServerJSON plus registry-owned _meta.
    fields: [_meta, server]
  - name: ServerListResponse
    description: Paged collection wrapper.
    fields: [servers, metadata]
  - name: Metadata
    description: Pagination cursor and count.
    fields: [count, nextCursor]
  - name: ServerMeta
    description: Publisher-provided metadata, namespaced under io.modelcontextprotocol.registry/publisher-provided.
  - name: ResponseMeta
    description: Registry-provided metadata, namespaced under io.modelcontextprotocol.registry/official.
  - name: RegistryExtensions
    description: The registry's own bookkeeping for a record — this is where lifecycle state lives.
    fields: [isLatest, publishedAt, status, statusChangedAt, statusMessage, updatedAt]
  - name: Package
    description: One installable distribution of the server (npm, pypi, oci, nuget, mcpb …).
    fields: [environmentVariables, fileSha256, identifier, packageArguments, registryBaseUrl, registryType, runtimeArguments, runtimeHint, transport, version]
  - name: Transport
    description: How a client talks to the server — stdio, streamable-http or sse, with url/headers when remote.
    fields: [headers, type, url, variables]
  - name: Repository
    description: Source repository the server is built from.
    fields: [id, source, subfolder, url]
  - name: Icon
    fields: [mimeType, sizes, src, theme]
  - name: Argument
    description: A command-line argument the runtime or package takes.
    fields: [choices, default, description, format, isRepeated, isRequired, isSecret, name, placeholder, type, value, valueHint, variables]
  - name: KeyValueInput
    description: A named environment variable or header value.
  - name: Input
    description: The base value/prompt shape Argument and KeyValueInput extend.
    fields: [choices, default, description, format, isRequired, isSecret, placeholder, value]
  - name: ValidationResult
    fields: [issues, valid]
  - name: ValidationIssue
    fields: [message, path, reference, severity, type]
  - name: TokenResponse
    description: The Registry JWT returned by any /auth/* exchange.
