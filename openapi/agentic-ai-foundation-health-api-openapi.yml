openapi: 3.2.0
info:
  description: 'A community driven registry service for Model Context Protocol (MCP) servers.


    GitHub repository | Documentation'
  title: Official MCP Registry Health API
  version: 1.0.0
tags:
- description: Health check endpoint for monitoring service availability
  name: Health
paths:
  /v0.1/health:
    get:
      description: Check the health status of the API
      operationId: get-health-v0.1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthBody'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Health check
      tags:
      - Health
  /v0/health:
    get:
      description: Check the health status of the API
      operationId: get-health-v0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthBody'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Health check
      tags:
      - Health
components:
  schemas:
    HealthBody:
      additionalProperties: false
      properties:
        github_client_id:
          description: GitHub OAuth App Client ID
          type: string
        status:
          description: Health status
          examples:
          - ok
          type: string
      required:
      - status
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
          - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type:
          - array
          - 'null'
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
          - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
          - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
          - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
          - https://example.com/errors/example
          format: uri
          type: string
      type: object
