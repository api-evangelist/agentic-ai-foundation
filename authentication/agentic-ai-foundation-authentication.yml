          credential: Generic OIDC ID token
        - path: /v0.1/auth/dns
          operationId: exchange-dns-token-v0.1
          credential: DNS TXT record signature proving domain control
        - path: /v0.1/auth/http
          operationId: exchange-http-token-v0.1
          credential: HTTP signature proving control of a well-known path on the namespace domain
      note: >-
        The same five endpoints exist under the /v0 prefix. GET /v0/health returns a github_client_id
