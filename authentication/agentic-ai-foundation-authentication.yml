    token_exchange:
      description: >-
        Five ways to obtain the Registry JWT. Each is a POST that trades an externally-issued credential
        for a registry-scoped token; there is no username/password and no long-lived API key.
      endpoints:
        - path: /v0.1/auth/github-at
