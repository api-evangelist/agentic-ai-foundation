description: >-
  Authentication profile across the AAIF-hosted surfaces that are actually callable. The Official MCP
  Registry API is read-anonymous / write-bearer: every GET and the validate endpoint are unauthenticated,
  and the four write operations require a Registry JWT minted by one of five token-exchange endpoints.
  The MCP endpoint on modelcontextprotocol.io is fully anonymous.
