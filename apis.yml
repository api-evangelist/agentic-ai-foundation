- aid: agentic-ai-foundation:agent2agent
  name: Agent2Agent (A2A)
  description: Agent2Agent (A2A) is an open protocol that lets AI agents built by different organisations, on different frameworks, discover each other's capabilities,
    communicate, delegate tasks and collaborate on multi-step work without sharing internal implementations. Discovery happens through an agent card published at
    /.well-known/agent-card.json. Hosted by AAIF.
  humanURL: https://a2a-protocol.org/latest/
  tags:
  - A2A
  - Agent Interoperability
  - Open Standard
  - Agent Discovery
