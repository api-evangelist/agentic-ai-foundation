- aid: agentic-ai-foundation:model-context-protocol
  name: Model Context Protocol (MCP)
  description: The Model Context Protocol (MCP) is an open JSON-RPC 2.0 standard for connecting AI applications to external systems — tools, resources and reusable
    prompt templates. Originally developed by Anthropic and donated to the Agentic AI Foundation, it is date-versioned; the current revision is 2026-07-28. The documentation
    host also operates a live, anonymous remote MCP server at /mcp exposing three tools, and serves an A2A agent card and two Agent Skills from /.well-known/.
  humanURL: https://modelcontextprotocol.io/
