- aid: agentic-ai-foundation:goose
  name: Goose AI Agent
  description: goose is a general-purpose, open-source AI agent that runs locally. Originally from Block and now governed by AAIF, it is written in Rust, ships a
    desktop app and a CLI for macOS, Linux and Windows, connects to 15+ LLM providers, and extends itself through MCP servers. It can also run as an Agent Client
    Protocol (ACP) agent server over stdio. Current release v1.48.0 (2026-08-27).
