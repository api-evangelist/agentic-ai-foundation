aid: agentic-ai-foundation
name: Agentic AI Foundation
description: 'The Agentic AI Foundation (AAIF) is a Linux Foundation project, announced 9 December 2025, that gives the core open standards and projects of the AI
  agent ecosystem a neutral home. It hosts five projects: Anthropic''s Model Context Protocol (MCP), Block''s goose agent, OpenAI''s AGENTS.md, the Agent2Agent (A2A)
  protocol, and agentgateway. Platinum members include Amazon Web Services, Anthropic, Block, Bloomberg, Cloudflare, Google, Microsoft and OpenAI. AAIF publishes
  no commercial API of its own; the callable surface in this profile belongs to its hosted projects — the Official MCP Registry REST API, a live anonymous MCP server
  on the MCP documentation host, and an A2A agent card served from the same host. Eight working groups cover reliability, agentic commerce, governance and regulatory
  alignment, identity and trust, observability, security and privacy, workflow integration, and taxonomy.'
