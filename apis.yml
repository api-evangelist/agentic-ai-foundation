- aid: agentic-ai-foundation:mcp-registry
  name: Official MCP Registry API
  description: The Official MCP Registry is the community registry service for Model Context Protocol servers, run by the MCP project. Its REST API publishes a full
    OpenAPI 3.1.0 contract with 32 operations across two live version prefixes (/v0.1 and /v0). Reads are anonymous — list, search and fetch server records with cursor
    pagination and an updated_since incremental-sync filter; writes require a Registry JWT minted by proving namespace ownership through GitHub OAuth, GitHub or generic
    OIDC, a DNS signature, or an HTTP signature. Errors are RFC 9457 problem details.
  humanURL: https://registry.modelcontextprotocol.io/docs
  baseURL: https://registry.modelcontextprotocol.io
