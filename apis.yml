- aid: agentic-ai-foundation:agents-md
  name: AGENTS.md
  description: AGENTS.md is a simple, universal convention that gives AI coding agents a consistent, predictable source of project-specific guidance — build commands,
    test commands, conventions and constraints — in one Markdown file at the root of a repository. Contributed by OpenAI and hosted by AAIF. It is a format convention
    rather than a callable API.
  humanURL: https://agents.md/
