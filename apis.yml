- aid: agentic-ai-foundation:agentgateway
  name: agentgateway
  description: agentgateway is an open-source data plane for agentic AI — it secures, observes and governs the connections between AI agents, models, MCP tools and
    APIs across ecosystems. Hosted by AAIF; current release v1.5.0 (2026-08-27). It is self-hosted infrastructure rather than a hosted service, so it exposes no public
    API endpoint of its own.
  humanURL: https://agentgateway.dev/
