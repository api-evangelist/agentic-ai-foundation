description: >-
  The Agentic AI Foundation publishes no API plans and no API pricing. It is a Linux Foundation project:
  every hosted project (Model Context Protocol, goose, AGENTS.md, agentgateway, Agent2Agent) is
  open-source and free, and the one live API surface — the Official MCP Registry — is free to read
  anonymously and free to publish to once namespace ownership is proven. There is no metered tier, no
  paid tier and no billing relationship of any kind for API access.
